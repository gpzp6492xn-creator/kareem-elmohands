<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة الفندق والمطعم الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #d4af37; }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 25px; }
        label { display: block; text-align: right; margin-bottom: 8px; font-weight: bold; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; }
        input:focus, select:focus { border-color: #d4af37; outline: none; }
        button { background: #d4af37; color: #1a1a1a; font-weight: bold; font-size: 18px; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 10px #d4af37; }
        .login-screen { display: block; }
        .dashboard { display: none; }
        .error { color: #ff4d4d; font-size: 14px; margin-bottom: 10px; display: none; }
        .success { color: #4dff4d; font-size: 16px; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div id="loginSection" class="container login-screen">
        <h1>🔒 تسجيل دخول الإدارة</h1>
        <label>أدخل كلمة مرور المسؤول:</label>
        <input type="password" id="passwordInput" placeholder="••••••••">
        <p id="loginError" class="error">⚠️ كلمة المرور غير صحيحة!</p>
        <button onclick="checkPassword()">دخول اللوحة</button>
    </div>

    <div id="dashboardSection" class="container dashboard">
        <h1>🛠️ لوحة تحكم طلبات الغرف</h1>
        
        <label>رقم غرفة النزيل:</label>
        <input type="number" id="roomNumber" placeholder="مثال: 305">

        <label>تحديث حالة الأوردر الحالي:</label>
        <select id="orderStatus">
            <option value="👨‍🍳 قيد التحضير في المطبخ الساخن">👨‍🍳 قيد التحضير في المطبخ</option>
            <option value="🛵 خرج مع عامل الديليفري وجاري التوصيل">🛵 جاري التوصيل للغرفة</option>
            <option value="✅ تم تسليم الطلب وإغلاقه بنجاح">✅ تم التسليم بنجاح</option>
        </select>

        <button onclick="updateStatus()">تحديث وإرسال إشعار للزبون</button>
        <p id="successMessage" class="success">🎯 تم تحديث الحالة وإرسال التنبيه للبوت بنجاح!</p>
    </div>

    <script>
        // توكن البوت الثابت لربط اللوحة بالسيرفر
        const BOT_TOKEN = '8799094408:AAEVlQBTGfiWQaN9ZgHOEXLc0uY583M_sm0';

        // التحقق من الباسورد
        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'kareem2026') { // الباسورد هنا
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // دالة إرسال التحديث للبوت
        function updateStatus() {
            const room = document.getElementById('roomNumber').value;
            const status = document.getElementById('orderStatus').value;
            const successTxt = document.getElementById('successMessage');

            if (!room) {
                alert('برجاء كتابة رقم الغرفة أولاً!');
                return;
            }

            // اللوحة بتبعت أمر مشفر للسيرفر عشان يغير الحالة للغرفة دي لايف
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            // هنا بنبعت رسالة مخفية بيفهمها السيرفر لتحديث القاعدة
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: '8799094408', // إرسال التنبيه لسيستم الإدارة
                    text: `تحديث_${room}_${status}`
                })
            })
            .then(res => {
                successTxt.style.display = 'block';
                setTimeout(() => { successTxt.style.display = 'none'; }, 4000);
            })
            .catch(err => {
                alert('حدث خطأ في الاتصال بالسيرفر!');
            });
        }
    </script>
</body>
</html>
